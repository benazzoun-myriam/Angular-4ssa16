<div class="event-card" [class.active]="isFavorite()">
  <img [src]="event().imageUrl" [alt]="event().title" class="event-image" />
  
  <div class="event-content">
    <span class="category-badge">{{ event().category | uppercase }}</span>
    
    <h3>{{ event().title }}</h3>
    
    <p> Date : {{ event().date | date:'dd/MM/yyyy' }}</p>
    <p> Prix : {{ event().price | currency:'EUR':'symbol' }}</p>

    <button (click)="onToggleFavorite()" [class.is-fav]="isFavorite()">
      @if (isFavorite()) {
         Retirer des favoris
      } @else {
        Ajouter aux favoris
      }
    </button>
  </div>
</div>
<a [routerLink]="['/events', event().id]" class="details-btn">Voir les détails</a>
